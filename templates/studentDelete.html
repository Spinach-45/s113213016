<!DOCTYPE html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FastAPI Template</title>
  </head>
<body>
	<h1>Delete Student Data</h1>
	<form method="post" action="/student/delete" onsubmit="return confirm('確定要刪除這筆資料嗎？');">
	<table>
	<tr>
		<td>學號</td>
		<td>姓名</td>
		<td>身高</td>
	</tr>
	<tr>
		<td>{{ data.stuid }} <input type="hidden" name="stuid" value="{{ data.stuid}}"></td>
		<td>{{ data.name }}</td>
		<td>{{ data.height }}</td>
	</tr>
	</table>
	<input type="submit" value="刪除">
	<a href="/students/list/template">取消</a>
	</form>
</body>
</html>
